<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dead Man's Wheel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dead Man's Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1a10;--panel:#3b2616;--ink:#f1e2c2;--accent:#d9a441;--red:#a8321f;--black:#1c1512;--green:#2f6b3a;--felt:#24503a;--edge:#6b4423}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Special Elite',Georgia,serif;min-height:100vh;transition:background 1.5s}
#app{max-width:1060px;margin:0 auto;padding:12px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:'Rye',Georgia,serif;font-weight:400;color:var(--accent);margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:1px}
#nightLbl{opacity:.8}
header .sp{flex:1}
button{font-family:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--accent);color:#1a1008;border-color:var(--accent)}
button.big{font-family:'Rye',serif;font-size:19px;padding:11px 22px;background:var(--accent);color:#1a1008;border-color:var(--accent)}
#dealer{margin:8px 0;padding:10px 14px;background:var(--panel);border-left:4px solid var(--accent);border-radius:4px;min-height:44px;font-size:15px}
#result{margin-top:4px;color:var(--accent);min-height:20px}
main{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:14px;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
#wheel{width:100%;display:block;touch-action:manipulation}
#wheelSec{position:relative}
.payok.short{border-color:#e0703a!important;color:#ffb08a!important}.payok.short .bon{color:#ffb08a!important}
#stage{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:12px;margin:0 auto}
#cam{position:absolute;left:0;top:0;width:100%;height:200%;transition:transform .8s cubic-bezier(.6,0,.2,1)}
#stage.down #cam{transform:translateY(-50%)}
#stage .pane{position:absolute;left:0;width:100%;height:50%}
#scenePane{top:0}#wheelPane{top:50%}
#sceneSvg{width:100%;height:100%;display:block;transition:transform .8s cubic-bezier(.6,0,.2,1);transform-origin:50% 100%}
#stage.down #sceneSvg{transform:scale(1.08)}
#lookBtn{position:absolute;right:6px;top:6px;z-index:2;font-size:12px;padding:4px 8px;background:rgba(26,13,6,.85)}
#lookBtn:disabled{opacity:0;pointer-events:none}
#sceneSvg .vb{transform-box:view-box}
#gBody{transform-origin:960px 940px;animation:scBreathe 4.2s ease-in-out infinite}
#gHead{transform-origin:960px 560px;animation:scHead 7s ease-in-out infinite;transition:transform .5s}
#sceneSvg .lamp{transform-origin:960px 0px;animation:scSway 6s ease-in-out infinite}
#scGlow{animation:scFlick 3.3s steps(1) infinite}
#scPup{animation:scLook 9s ease-in-out infinite}
#lids{animation:scBlink 5.5s steps(1) infinite;opacity:0}
#stage.hot #gHead{animation:none;transform:translateY(10px) scale(1.04)}
#stage.down #gBody,#stage.down #gHead,#stage.down .lamp,#stage.down #scPup,#stage.down #scGlow{animation-play-state:paused}
@keyframes scBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes scHead{0%,100%{transform:rotate(-1.2deg) translateY(0)}30%{transform:rotate(.9deg) translateY(-3px)}60%{transform:rotate(1.6deg) translateY(-1px)}80%{transform:rotate(-.4deg) translateY(-4px)}}
@keyframes scSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes scFlick{0%,100%{opacity:.5}40%{opacity:.56}43%{opacity:.4}46%{opacity:.55}80%{opacity:.48}}
@keyframes scLook{0%,40%,100%{transform:translate(0,0)}45%,60%{transform:translate(-5px,1px)}65%,85%{transform:translate(4px,0)}}
@keyframes scBlink{0%,96%{opacity:0}97%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){#gBody,#gHead,#sceneSvg .lamp,#scGlow,#scPup{animation:none}}
#pop{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:3;font-family:'Rye',serif;font-size:clamp(34px,11vw,64px);opacity:0;text-shadow:0 0 3px #000,0 3px 0 #000,0 0 18px rgba(0,0,0,.9)}
#pop.go{animation:pop 1.9s ease-out forwards}
#pop.w{color:#8dff9a}#pop.l{color:#ff8f7f}#pop.e{color:var(--ink)}#pop.c{color:#ff4a3a}
#pop small{display:block;font-size:.38em;font-family:'Special Elite',serif;color:var(--ink)}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}75%{opacity:1;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-40px)}}
body.shake #app{animation:shk .5s}
@keyframes shk{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.stats b.bump{animation:bmp .7s}
@keyframes bmp{30%{transform:scale(1.25);color:#fff}}
.rim{fill:var(--edge);stroke:var(--accent);stroke-width:2}
.pk{stroke:var(--accent);stroke-width:1;cursor:pointer}
.pk.red{fill:var(--red)}.pk.black{fill:var(--black)}.pk.green{fill:var(--green)}
.pk.void{fill:#000;stroke:#7b5cff}
.pk.gold{stroke:#ffd84a;stroke-width:3;fill-opacity:.9}
.pk.mag{stroke:#fff;stroke-width:3}
.bonl{display:block;font-size:1.05em}
.felt.mouth{position:relative;background:radial-gradient(ellipse at 50% 55%,#1a0306 0%,#3d070c 45%,#6b1219 100%);border-color:#8a1c24;padding-top:22px}
.felt.mouth::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;pointer-events:none;z-index:3;background:linear-gradient(-45deg,transparent 50%,#efe6cf 50%) 0 0/24px 24px repeat-x,linear-gradient(45deg,transparent 50%,#efe6cf 50%) 0 0/24px 24px repeat-x;background-position:0 -12px,0 -12px}
.felt.mouth>.act{background:#3d070c;position:sticky;padding-top:20px}
.felt.mouth>.act::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;pointer-events:none;background:linear-gradient(-45deg,#efe6cf 50%,transparent 50%) 0 0/24px 24px repeat-x,linear-gradient(45deg,#efe6cf 50%,transparent 50%) 0 0/24px 24px repeat-x;background-position:0 4px,0 4px}
.bossbar{position:relative;height:22px;border:1px solid #c0392b;border-radius:6px;background:#1a0306;margin:4px 0 6px;overflow:hidden}
.bossbar .bfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7a0d14,#c0392b);transition:width .6s}
.bossbar span{position:relative;display:block;text-align:center;font-size:12px;line-height:22px;color:#fff;letter-spacing:.08em}
.brules{font-size:13px;color:#ffb4a8;margin-bottom:8px}
.betbar .chips{width:100%}.betbar .chips button{flex:1 1 auto;min-width:0;padding-left:3px;padding-right:3px}
.amt input{width:60%;font:inherit;font-size:1.6em;text-align:center;padding:6px;border-radius:8px;border:2px solid var(--accent);background:#1a0f08;color:#fff}.amt .row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.term.on{color:#fff;text-decoration-style:solid}.term:focus{outline:none}.tinfo{display:block;background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;text-align:left}.bonl b{color:#8dff9a;font-size:1.25em}
.brandm{fill:#ff8a2a;stroke:#2a1205;stroke-width:1;pointer-events:none}
.brandm2{fill:none;stroke:#ff8a2a;stroke-width:1.6;pointer-events:none}
.magov{fill:#fff;pointer-events:none;animation:magp 1s ease-in-out infinite}
@keyframes magp{0%,100%{fill-opacity:.1}50%{fill-opacity:.4}}
.nudgeov{fill:#8dff9a;stroke:#fff;stroke-width:3;pointer-events:none;animation:magp .8s ease-in-out infinite}
.magic{font-size:16px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.arming .rim{stroke:#fff;stroke-width:5;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.2}}
.oc{display:inline-block;background:rgba(0,0,0,.62);border-radius:8px;padding:1px 6px;font-size:12px;margin-top:3px;color:var(--ink)}
.oc.w{color:#8dff9a}.oc.l{color:#ff9d8f}
.outs .oc{display:block;width:fit-content;margin:3px auto 0}
.ocw{font-family:'Special Elite',serif;font-size:11px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#ddd;stroke:#000;stroke-width:2.5px;paint-order:stroke}
.ocw.w{fill:#8dff9a}.ocw.l{fill:#ff9d8f}
#wheel{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.pk.hit{filter:brightness(2.1)}
.arming .pk:hover{filter:brightness(1.6)}
.pl{fill:var(--ink);font-family:'Rye',serif;font-size:17px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hub{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.hub2{fill:var(--bg);stroke:var(--edge);stroke-width:2}
.ball{fill:#fffbe8;stroke:#333;stroke-width:1;pointer-events:none}
.d2 #wheel{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015)}}
.d3 h1{animation:shiver 3s steps(2) infinite}
@keyframes shiver{0%,92%{transform:none}94%{transform:translate(2px,-1px) skewX(4deg)}97%{transform:translate(-2px,1px)}}
#powers{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.box{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:'Rye',serif;font-size:22px;color:var(--accent);font-weight:400}
.stats small{opacity:.75}
.relic{padding:5px 0;border-bottom:1px dashed var(--edge);font-size:14px}
.relic:last-child{border:0}
.relic b{color:var(--accent);font-weight:400}
h3{font-family:'Rye',serif;font-weight:400;margin:0 0 6px;font-size:16px;color:var(--accent)}
#lower{margin-top:12px}
.felt{background:var(--felt);border:2px solid var(--edge);border-radius:10px;padding:12px}
.felt>.act{position:sticky;bottom:0;background:var(--felt);padding:8px 12px;margin:12px -12px -12px!important;z-index:4;border-top:1px solid var(--edge);box-shadow:0 -10px 14px -8px rgba(0,0,0,.55);border-radius:0 0 8px 8px}
.chips,.row,.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.betbar{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.betbar .chips,.betbar .tools{flex-wrap:nowrap;gap:6px;margin:0}
.betbar button{flex:1 1 0;min-width:0;padding:7px 3px;white-space:nowrap}
.tools .ti{display:none}
.betbar .qbtn{flex:0 0 auto;padding-left:12px;padding-right:12px}
.hl{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;background:rgba(217,164,65,.16);animation:hlp 1.6s ease-out 2}
@keyframes hlp{0%{background:rgba(217,164,65,.45)}100%{background:rgba(217,164,65,.12)}}
.term{display:inline;background:none;border:0;padding:0;margin:0;font:inherit;font-weight:700;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;border-radius:0;cursor:pointer}
.term:hover:not(:disabled){border:0;background:none}
#overlay{transition:opacity .25s}
#overlay.peek{opacity:.03;pointer-events:none}
.peekhl{position:relative;z-index:7;border-radius:8px;outline:3px solid var(--accent);outline-offset:3px;background:rgba(217,164,65,.25);animation:hlp .9s ease-out 3}
.dinfo{margin:12px 0 4px;padding:8px 12px;border:1px dashed var(--edge);border-radius:8px;background:rgba(0,0,0,.25)}
.dinfo p{margin:5px 0}.dinfo.plain{border:0;background:none;padding:0}
.clist{text-align:left;display:inline-block;margin:2px 0 4px;padding-left:20px}.clist li{margin:3px 0}
.nicon{font-size:46px;line-height:1.1;color:var(--accent);margin:4px 0 2px}
.acthead{background:none;border:0;padding:0;margin:0;font-family:'Rye',serif;font-size:16px;color:var(--accent);display:flex;gap:8px;align-items:center;width:100%;text-align:left;border-radius:0}
.acthead:hover:not(:disabled){border:0}
.acthead b{font-weight:400;opacity:.8;font-size:13px}.acthead .chev{margin-left:auto;opacity:.8}
.actlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
#activeBox.collapsed .actlist{display:none}
.am{font-size:13px;padding:3px 10px;border-radius:14px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--ink);white-space:nowrap}
.am.good{color:#9dffaa;border-color:#2f7a3f}.am.bad{color:#ff9a8a;border-color:#7a2a1a}.am.dim{opacity:.5}
.am.relic{color:var(--accent)}.am.cosmic{color:#b79bff}
.actsep{font-size:11px;opacity:.6;margin:0 2px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.tipline{font-size:13px;background:rgba(0,0,0,.28);border-left:3px solid var(--accent);border-radius:6px;padding:5px 9px;margin-bottom:8px}
.coach{font-size:13px;background:rgba(0,0,0,.3);border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.felt>.act .spinb{flex:1 1 auto;padding:10px 12px}
.payok{line-height:1.15;flex:0 1 auto;font-size:13px}
.payok .bon{display:block;font-size:11px;opacity:.85}
.spinb .tag{display:inline-block;font-family:'Special Elite',serif;font-size:12px;background:rgba(0,0,0,.22);border-radius:8px;padding:1px 7px;margin-left:7px;vertical-align:middle}
.spinb .tag.up{background:#7a1e12;color:#ffd6cc}.spinb .tag.cool{background:#1f5a2e;color:#c8ffd2}
.hubt{font-family:'Rye',serif;fill:var(--accent);text-anchor:middle;dominant-baseline:central;pointer-events:none;animation:bpulse 1s ease-in-out infinite}
.tapbox{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;border-radius:6px}
.tapbox:hover:not(:disabled){border:0;background:rgba(255,255,255,.04)}
.qi{display:inline-block;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;border:1px solid currentColor;font-size:11px;opacity:.7;margin-left:6px;vertical-align:1px}
.eyebtn{display:inline;width:auto;color:#cdbdff}.eyebtn b{color:#fff;font-weight:400}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font-size:13px;padding:4px 9px;border-radius:14px;color:var(--accent)}
.rchip.cosmic{color:#b79bff}
.sheet{text-align:left;max-width:520px}
.sleight{max-width:460px}
.skbar{position:relative;height:34px;margin:16px 0 8px;border-radius:17px;background:#1a0f08;border:2px solid var(--edge);overflow:hidden}
.skz{position:absolute;top:0;bottom:0;background:#2f7a3f}
.skp{position:absolute;top:0;bottom:0;left:40%;width:20%;background:var(--accent)}
.skn{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff;left:0}
.cursel{color:#ff8f7f;font-weight:400}
.skres{min-height:22px;margin-bottom:6px}.skres .good{color:#8dff9a;font-weight:400}.skres .bad{color:#ff8f7f;font-weight:400}
.sheet h3{text-align:center;font-size:22px;margin-bottom:4px}
.sheet .lede{text-align:center;opacity:.85;margin:0 0 10px}
.sheet h4{font-family:'Rye',serif;font-weight:400;color:var(--accent);font-size:15px;margin:14px 0 4px}
.sheet ul{margin:0;padding-left:20px}.sheet li{margin:3px 0;line-height:1.4}
.sheet li b{color:var(--accent);font-weight:400}
.sheet .now{background:rgba(0,0,0,.3);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin:8px 0}
.sheet .btns{text-align:center;margin-top:16px;display:flex;gap:8px;justify-content:center}
.topic{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.topic b{display:block;font-family:'Rye',serif;font-weight:400;color:var(--accent);font-size:15px}
.topic span{font-size:13px;opacity:.85}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:8px}
.board{position:relative;height:calc(3*var(--rh,58px));margin-bottom:10px}
.board .spot{position:absolute;border-radius:0;min-height:0;padding:1px;display:flex;flex-direction:row;flex-wrap:wrap;gap:0 4px;align-items:center;align-content:center;justify-content:center;overflow:hidden}
.board .spot .l{font-size:16px;display:inline}
.board .spot .stake{position:static;font-size:11px;padding:0 5px;margin:0}
.board .oc{font-size:11px;padding:0 4px;margin:0}
.board .spot.bet{box-shadow:inset 0 0 0 2px var(--accent)}
button.bet:disabled,button.has:disabled{opacity:.85}
.hot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;padding:0;border-radius:11px;background:transparent;border:0;font-size:10px;z-index:2;line-height:1}
.hot::after{content:'';display:block;width:7px;height:7px;margin:auto;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--accent)}
.hot.cn::after{border-radius:1px}
.hot.has{width:auto;min-width:20px;height:18px;padding:0 5px;background:var(--accent);color:#1a1008;border:1px solid #1a1008;z-index:3}
.hot.has::after{display:none}
.hot:disabled{opacity:.6}
.outs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.outs .spot{grid-column:span 3}
.outs .s3{grid-column:span 4}
.outs .luckwrap{grid-column:span 6;position:relative;display:flex}
.luckwrap .spot{flex:1;min-width:0}.lnums{color:#ffe08a;font-size:1.15em}
.lq{position:absolute;top:5px;right:5px;width:24px;height:24px;padding:0;border-radius:50%;font-size:13px;line-height:1;z-index:2;background:rgba(0,0,0,.35)}
.lnext{display:block;font-size:11px;opacity:.85;margin-top:2px}
.outs .voidspot{grid-column:span 12}
.outs .spot.bet small{display:none}
.outs .spot .stake{position:static;display:inline-block;margin:2px auto 0}
.spot{position:relative;padding:8px 4px;text-align:center;line-height:1.25;min-height:58px}
.spot .l{font-family:'Rye',serif;font-size:17px;display:block}
.spot small{opacity:.8;font-size:11px}
.spot.red{background:var(--red)}.spot.black{background:var(--black)}.spot.green{background:var(--green)}
.spot .stake{position:absolute;top:-7px;right:-5px;background:var(--accent);color:#1a1008;border-radius:10px;padding:1px 7px;font-size:12px;border:1px solid #1a1008}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:10px;text-align:left;font-size:13px;line-height:1.35;display:block;width:100%}
.card b{display:block;font-family:'Rye',serif;font-weight:400;color:var(--accent);font-size:15px;margin-bottom:3px}
.card .p{display:block;margin-top:6px;color:var(--accent)}
.card.sold{opacity:.3}
.card.on{background:var(--panel);color:var(--ink);outline:3px solid var(--accent)}
.cosmic b{color:#b79bff}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-start;justify-content:flex-start;padding:16px;overflow:auto;z-index:5}
#overlay.show{display:flex}
.modal{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:22px;max-width:680px;width:100%;text-align:center;margin:auto}
.modal.sheet{text-align:left}
.modal p{line-height:1.5}
.modal .shop{text-align:left;margin-top:12px}
.hint{font-size:12px;opacity:.7}
.cap{font-family:'Special Elite',serif;font-size:12px;color:var(--ink);opacity:.8;margin-left:8px}
.luckov{fill:#ffd84a;fill-opacity:.85;stroke:#fff3b0;stroke-width:1;pointer-events:none}
.luckov.burn{fill:#140204;stroke:#ff5a2a;stroke-width:2}.luckov.burn+.lstar{fill:#ff5a2a}
.lstar{fill:#3a2500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.spot.luckspot{background:#5a4208;border-color:#ffd84a;color:#ffe9a0}
.board .spot.lucky{background-image:linear-gradient(rgba(255,216,74,.22),rgba(255,216,74,.22))}
.ls{font-style:normal;color:#ffd84a;margin-right:2px}
.luckline{color:#ffe9a0}.luckline b{color:#fff;font-weight:400}
#tent{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#tentBox{position:absolute}
.tn{position:absolute;width:0;height:0;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9))}
.sg{position:absolute;left:0;top:0;transform-origin:50% 0;border-radius:45% 45% 50% 50%;animation:wr 3s ease-in-out infinite}
.sg>.sg{left:50%;top:70%}
@keyframes wr{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@media (prefers-reduced-motion:reduce){.sg{animation:none}}
.face{display:block;width:100%;height:100%}
.portrait{width:132px;height:132px;margin:0 auto 10px}
#face{float:left;width:62px;height:62px;margin:0 12px 4px 0;cursor:pointer}
#dealer::after{content:'';display:block;clear:both}
.eyeov{fill:#7b5cff;fill-opacity:.38;stroke:#d6c8ff;stroke-width:2.5;pointer-events:none}
.board .spot.watched{box-shadow:inset 0 0 0 3px #b79bff;filter:saturate(.6)}
#eyeLine{color:#cdbdff;margin-top:3px}#eyeLine b{color:#fff;font-weight:400}
.heatlbl{margin-top:5px;font-size:13px}.heatlbl b{color:#ffb36b;font-weight:400}
.heattip{font-size:12px;opacity:.85;margin-top:3px;line-height:1.3}.heattip b{color:#ffb36b;font-weight:400}
button.qm{padding:1px 8px;font-size:11px;margin-left:6px;border-radius:10px}
.lshort{display:none}
.oc.c{color:#fff;background:#c0392b}.ocw.c{fill:#ff5a4a}
.heatbar{position:relative;height:9px;border-radius:5px;background:rgba(0,0,0,.45);border:1px solid var(--edge);margin-top:3px;overflow:hidden}
.heatbar i{display:block;height:100%;background:linear-gradient(90deg,#e2b04a,#e2622e 60%,#d21f1f)}
.heatbar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
button.big.danger{background:#c0392b;border-color:#ff9d8f;color:#fff}
.nexttab{font-size:16px;padding:8px 10px;margin-bottom:10px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--accent)}
.nexttab b{color:var(--accent);font-weight:400}
.nexttab.bad{border-color:#ff9d8f;color:#ffb3a8;background:rgba(120,20,10,.45)}
.nexttab.bad b{color:#fff}
button.payok{border-color:#8dff9a;color:#8dff9a}
.dlg{max-width:520px}
.dlg h3{font-size:22px;margin-bottom:10px}
.dlg p{font-size:16px;margin:8px 0}
.dlg .big{margin-top:12px}
.fb{text-align:left;margin:10px 0 14px;padding:10px;border:1px dashed var(--edge);border-radius:8px}
.fb textarea{display:block;width:100%;min-height:54px;margin:0 0 8px;font:inherit;font-size:15px;padding:8px;border-radius:6px;border:1px solid var(--edge);background:#0006;color:var(--ink);resize:vertical}
.fb button{width:100%}
#banner{display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:6;background:var(--accent);color:#1a1008;font-family:'Rye',serif;font-size:20px;padding:8px 18px;border-radius:10px;border:2px solid #1a1008;pointer-events:none;white-space:nowrap;animation:bpulse 1s ease-in-out infinite}
#banner.show{display:block}
@keyframes bpulse{50%{opacity:.6}}
.fsinfo{display:none;font-size:13px;margin-bottom:6px}
.fsinfo b{color:var(--accent);font-weight:400}
.fsinfo span{display:block;color:var(--accent)}
body.fs{overflow:hidden}
body.fs #lower{position:fixed;inset:0;z-index:4;margin:0;overflow:hidden;background:var(--bg);grid-area:auto}
body.fs .felt{height:100%;display:flex;flex-direction:column;border-radius:0;border:0;padding:8px}
body.fs .fsinfo{display:block}
body.fs .board{flex:1 1 auto;height:auto!important;min-height:0}
body.fs .felt>.hint,body.fs .coach{display:none}
body.fs .betbar,body.fs .outs,body.fs .felt>.act{flex:0 0 auto}
body.fs .felt>.act{position:static;margin:6px -8px -8px!important;padding:6px 8px}
body.fs .outs{gap:4px}
body.fs .outs .spot{min-height:0;padding:4px 2px}
body.fs .outs .spot .l{font-size:14px}
body.fs .outs .oc{font-size:10px;margin:1px auto 0}
body.fs .board .spot .l{font-size:clamp(14px,3.2vmin,22px)}
.spot.voidspot{background:#000;border-color:#7b5cff;color:#d9d2ff}
button.rm{background:#c0392b;border-color:#ff9d8f;color:#fff}
.removing .spot:not(.bet):not(:disabled){opacity:.4}
.removing .hot:not(.has){visibility:hidden}
.removing .stake,.removing .hot.has{background:#c0392b;color:#fff;border-color:#fff}
.inv{text-align:left;max-height:86vh;overflow:auto}
.inv h3{margin-top:14px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:sticky;top:-22px;background:var(--panel);padding:6px 0;z-index:2}
.inv .hint{margin-bottom:4px}
.bigm{font-family:'Rye',serif;font-size:22px;color:#8dff9a;text-align:center;margin:6px 0 8px}
button.hotm{border-color:#8dff9a;color:#8dff9a}
.inv .relic span{float:right;color:var(--accent);margin-left:10px}
@media(max-width:520px){.hot{width:20px;height:20px}}
@media (orientation:landscape) and (max-height:520px){
html,body{height:100%;overflow:hidden}
#app{max-width:none;height:100vh;height:100dvh;padding:4px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:4px 10px;grid-template-areas:"head head" "wheel stats" "wheel dealer" "wheel lower"}
header{grid-area:head;gap:8px;align-items:center;flex-wrap:nowrap}
h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nightLbl{font-size:12px;white-space:nowrap}
header button{padding:3px 8px;font-size:12px;white-space:nowrap}
main{display:contents}
main>section:first-child{grid-area:wheel;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#stage{width:min(calc(100vh - 78px),calc(100dvh - 78px),40vw)}
#powers{margin-top:4px;gap:4px;justify-content:center;flex-wrap:nowrap}
#powers button{padding:4px 6px;font-size:11px;white-space:nowrap}
main>section:last-child{grid-area:stats;display:flex;gap:6px;min-width:0}
main>section:last-child .box{margin:0;padding:3px 8px}
main>section:last-child .box:first-child{flex:0 0 auto}
main>section:last-child .box:first-child .stats>div:nth-child(4){display:none}
main>section:last-child .box:nth-child(2){display:flex;align-items:center;gap:6px;margin:0;min-width:0;flex:1 1 auto}
#activeBox .acthead{width:auto;font-size:12px;flex:0 0 auto}
#activeBox .actlist{margin:0;flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
#activeBox .am{font-size:11px;padding:1px 7px}
#activeBox .actsep{font-size:9px}
.stats b{display:inline;font-size:15px;margin-right:4px}
.stats small{font-size:11px}
#dealer{grid-area:dealer;margin:0;padding:3px 8px;font-size:12px;min-height:0;min-width:0;overflow:hidden;line-height:1.25}
#say{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#result{margin:0;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eyeLine{margin:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#face{width:44px;height:44px;margin:0 8px 0 0}
.portrait{width:84px;height:84px;margin-bottom:4px}
.heatlbl{font-size:11px;margin-top:1px}
.heattip{font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.qm{font-size:10px;padding:0 6px}
.heatbar{height:6px;margin-top:2px}
#lower{grid-area:lower;margin:0;min-height:0;overflow:auto}
.felt{padding:6px;border-width:1px}
.chips,.row{margin-bottom:5px;gap:5px}
.chips button,.row button,.tools button{padding:3px 8px;font-size:12px}
.betbar{flex-direction:row;gap:8px;margin-bottom:5px}
.betbar .chips,.betbar .tools{gap:4px}
.betbar button{flex:0 0 auto;padding:3px 7px}
.tools .tl{display:none}.tools .ti{display:inline}
.coach,#lower .nudgeb,#eyeLine .luckline,.qi{display:none}
.tipline{font-size:11px;padding:2px 7px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.payok{font-size:12px}.payok .bon{display:inline;font-size:12px}
body:not(.fs) .outs .lw,.outs .pw{display:none}
.felt>.act .spinb{flex:0 0 auto;padding:6px 12px}
.felt>.act{margin:5px -6px -6px!important;padding:4px 6px}
.row{margin:5px 0 0 !important}
button.big{font-size:14px;padding:6px 12px}
.board{--rh:34px;margin-bottom:5px}
.board .spot .l{font-size:13px}
.board .spot .stake,.board .oc{font-size:9px;padding:0 3px}
.spot .l{font-size:14px;display:inline}
.spot small{font-size:10px}
.oc{margin:0;font-size:11px;padding:0 4px}
.hot{width:17px;height:17px;font-size:9px}
.hot::after{width:5px;height:5px}
.outs,body.fs .outs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
body.fs .fsinfo span{display:inline;margin-left:10px}
body.fs .board .spot .stake,body.fs .board .oc{font-size:11px}
.outs .spot{min-height:0;padding:3px 1px}
.outs .spot,.outs .s3,.outs .voidspot{grid-column:auto}
.outs .luckwrap{grid-column:span 2;order:9}
.lq{width:16px;height:16px;font-size:10px;top:2px;right:2px}
.outs .lst{display:none}
.outs .luckspot .l{padding-right:12px}
.lnext{display:none}
.outs .voidspot{order:8}
.outs .od,.outs .lfull{display:none}
.outs .lshort{display:inline}
.outs .spot .l{font-size:10px;display:block;white-space:nowrap;overflow:hidden}
.outs .spot small{font-size:8px;white-space:nowrap}
.outs .oc{font-size:8px;padding:0 2px;margin:1px auto 0;white-space:nowrap}
.outs .spot .stake{font-size:9px;padding:0 4px;margin:1px auto 0}
.felt>.hint,.row .hint{display:none}
.shop{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-bottom:5px}
.card{padding:6px;font-size:11px}
.card b{font-size:13px}
h3{font-size:13px;margin-bottom:3px}
.modal{padding:12px;max-height:94vh;overflow:auto}
.modal h1{font-size:20px}
.modal p{margin:6px 0;font-size:13px}
.chips{flex-wrap:nowrap}
.chips button{white-space:nowrap}
.outs .spot{min-width:0;overflow:hidden}
}
@media (orientation:landscape) and (max-height:350px){
#say{-webkit-line-clamp:1}
.board{--rh:29px}
.hot{width:15px;height:15px}
.chips button,.row button,.tools button{padding:2px 6px;font-size:11px}
button.big{font-size:13px;padding:4px 10px}
.outs .spot{padding:1px}
#stage{width:min(calc(100vh - 70px),calc(100dvh - 70px),40vw)}
}
</style>
</head>

function wheelSum(){const cn={};G.wheel.forEach(p=>{if(!p.void)cn[p.num]=(cn[p.num]||0)+1;});const miss=[],dup=[];G.zeros.concat(Array.from({length:G.N},(_,i)=>i+1)).forEach(v=>{if(!cn[v])miss.push(lab(v));else if(cn[v]>1)dup.push(lab(v)+'x'+cn[v]);});
  return{size:G.wheel.length,house:G.house,table:G.N,voids:G.wheel.filter(p=>p.void).length,gold:G.wheel.filter(p=>p.gold).map(plab),removed:miss,dupes:dup,red:G.wheel.filter(p=>p.color==='red').length,black:G.wheel.filter(p=>p.color==='black').length,green:G.wheel.filter(p=>p.color==='green').length};}

function cleanName(n){n=(n||'').trim();if(!n)return n;
  const t=n.toLowerCase().replace(/[@4]/g,'a').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/0/g,'o').replace(/[5$]/g,'s').replace(/7/g,'t').replace(/[^a-z]/g,'');
  return BADN.some(r=>r.test(t))?'Stranger':n;}
const playerName=()=>cleanName(store.get(NAME_KEY)||'');
let sentAt='';
function postRun(leaving){
  if(!SHEET_URL||!G||!G.log||!G.log.startRelic)return;const L=G.log;if(sentAt===L.updated)return;
  let body;try{body=JSON.stringify(L);}catch(e){return;}sentAt=L.updated;
  try{
    if(leaving&&body.length<60000&&navigator.sendBeacon&&navigator.sendBeacon(SHEET_URL,new Blob([body],{type:'text/plain;charset=utf-8'})))return;
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:body.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body}).catch(()=>{});
  }catch(e){}
}
function saveGame(){
  if(!G||!HAS_LS)return;

  if(!['bet','shop','closing','spinning','nudge'].includes(G.mode))return;
  if(!G.log||!G.log.startRelic)return;
  try{store.set(SAVE_KEY,JSON.stringify({v:SAVE_V,at:Date.now(),g:G}));}catch(e){}
}
function loadSave(){
  try{const d=JSON.parse(store.get(SAVE_KEY)||'null');if(!d||d.v!==SAVE_V||!d.g||!d.g.log||!Array.isArray(d.g.wheel)||!d.g.wheel.length)return null;
    if(!['bet','shop','closing','spinning','nudge'].includes(d.g.mode))return null;return d.g;}catch(e){return null;}
}
function resumeGame(){
  const g=loadSave();if(!g){pickStart();return;}
  G=g;G.relics=G.relics.map(x=>x==='deadman'?'outlaw':x);if(!G.wheel.some(p=>p.copy)&&G.brands){const sn={};for(let k=G.wheel.length-1;k>=0;k--){const p=G.wheel[k];if(p.void||p.color==='green')continue;if(sn[p.num])p.copy=true;sn[p.num]=1;}}if(G.shop&&G.shop.relics)G.shop.relics.forEach(r=>{if(r.id==='deadman')r.id='outlaw';});G.armed=G.mode==='shop'?G.armed:null;G.fsHold=false;G.log.resumes=(G.log.resumes||0)+1;sentAt='';

    const n=G.wheel.length;G.balls.forEach(b=>{b.r=132;b.ang=G.wAngle+(b.idx+0.5)*360/n;});G.armed=null;applyDread();

    else resolve();
    return;
  }
  tip('You sit back down. Night '+G.night+', '+fmt(G.chips)+' chips.');applyDread();render();
}

function bossRules(){const B=G.boss;if(!B)return;const pool=Object.keys(BRULES).filter(r=>(r!=='dark'||G.wheel.some(p=>p.void))&&(r!=='stars'||G.lucky.length)),want=B.phase>=3?2:1;

function numsOf(k){const c=k[0];if(c==='n')return[+k.slice(1)];if(c==='s'||c==='c')return k.slice(1).split('_').map(Number);return null;}

function pocketClick(i){
  if(G.mode==='nudge'){
    if(G.armed!=='nudge')return;
    const n=G.wheel.length,R=reach();let best=null;
    G.balls.forEach((b,j)=>{let d=((i-b.idx)%n+n)%n;if(d>n/2)d-=n;if(d!==0&&Math.abs(d)<=R&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,j};});
    if(best){nudge(best.d,best.j);return;}
    tip('Pick one of the glowing pockets near the ball.');sfx.bad();render();return;
  }
  if(G.mode==='bet'&&G.armed==='magnet'){G.magnet=i;G.armed=null;{const n=G.wheel.length,M=magStr();tip('Magnet set on '+pname(G.wheel[i])+'. The ball has a '+pct(M/(n+M-1))+' chance to land there this spin, up from '+pct(1/n)+'.');}sfx.buy();render();return;}
  if(G.mode==='shop'&&G.armed!==null){
    const it=G.shop.tools[G.armed];if(!it||it.sold)return;
    const first=!(it.left>0);if(first&&(G.chips<it.price||!canBuy('t')))return;
    const p=G.wheel[i],n=G.wheel.length,T=TOOLS[it.type],multi=it.type==='pry'||it.type==='brand'||it.type==='paint';let ok=true;const was=plab(p);
    switch(it.type){
      case'pry':if(n<=3)ok=false;else G.wheel.splice(i,1);break;
      case'brand':G.wheel.splice(i,0,{...p,gold:false,goldHits:0,copy:true});if(first)G.brands=(G.brands||0)+1;break;
      case'paint':if(p.void||p.color==='green')ok=false;else p.color=p.color==='red'?'black':'red';break;
      case'gild':if(p.gold&&!(p.goldHits>0))ok=false;else{p.gold=true;p.goldHits=0;}break;
      case'door':if(p.void)ok=false;else{p.void=true;p.color='void';p.num=-1;}break;
    }
    if(!ok){tip('That will not work on this pocket.');sfx.bad();render();return;}
    if(first){G.chips-=it.price;G.bought.t++;it.left=multi?span():1;}
    it.left--;G.balls=[];G.hits=[];G.log.buys.push({n:G.night,tool:it.type,on:was,price:first?it.price:0});
    if(it.left<=0){it.sold=true;G.armed=null;tip('Done. The wheel remembers.');if(window.innerHeight>window.innerWidth)setTimeout(()=>{try{$('lower').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}},500);}
    else tip(T.name+': done. Heavy Hands lets you use it on '+it.left+' more pocket'+(it.left===1?'':'s')+'. Tap the next one.');
    G.shop.tools.forEach(t=>{if(t.type==='brand'&&!t.sold&&!(t.left>0))t.price=toolPrice('brand');});sfx.buy();render();return;
  }
  if((G.mode==='bet'||G.mode==='shop')&&G.armed===null&&G.wheel[i]){tip(pinfo(G.wheel[i],i));render();}
}

    '</div><div class="tools"><button data-act="fs" class="'+(inFs?'on':'')+'" title="Full screen table"><span class="tl">'+(inFs?'Normal view':'Full screen')+'</span><span class="ti">'+(inFs?'\u2715':'\u26F6')+'</span></button><button data-act="remove" class="'+(G.remove?'rm':'')+'"'+(G.mode==='bet'&&totalBets()>0?'':' disabled')+'>'+(G.remove?'Removing':'Remove')+'</button><button data-act="rebet"'+(G.last&&G.mode==='bet'?'':' disabled')+'>Rebet</button><button data-act="clear"'+(G.mode==='bet'?'':' disabled')+'>Clear</button><button data-act="help" title="How to bet" class="qbtn">?</button></div></div>';
  {const N=G.N,hf=Math.floor(N/2),t=N/3;
  if(G.mode==='bet'&&G.night===1&&!store.get('dmw_coach'))h+='<div class="coach">Tap a number or color to bet the selected chip. The dots between numbers bet on 2 or 4 at once. Tap the wheel to see what a pocket does.</div>';
  h+=boardHTML()+'<div class="outs">'+spot('red','Red','red')+spot('black','Black','black')+spot('odd','Odd')+spot('even','Even')+spot('low','1-'+hf)+spot('high',(hf+1)+'-'+N)+luckSpot()+spot('t1','1-'+t,'s3')+spot('t2',(t+1)+'-'+2*t,'s3')+spot('t3',(2*t+1)+'-'+N,'s3')+spot('k1','1·4·7…','s3')+spot('k2','2·5·8…','s3')+spot('k3','3·6·9…','s3')+(has('unwritten')?spot('void','The Void','voidspot'):'')+'</div>';}
  h+='<div class="row act">';
  if(G.mode==='bet'){
    {const proj=heatOn()?Math.round(heatPlan()):0,mg=G.magnet>=0&&!locked(),cool=heatOn()&&proj===0&&!mg&&G.heat>0&&totalBets()>0;
    h+='<button class="big spinb'+(heatOn()&&G.heat+proj>=100?' danger':'')+'" data-act="spin">Spin<span class="tag">Bet '+fmt(totalBets())+'</span>'+(proj>0?'<span class="tag up">Heat +'+proj+'</span>':cool?'<span class="tag cool">Heat -'+HEAT.cool+'</span>':'')+(mg?'<span class="tag up">Magnet +'+HEAT.mag+' if it hits</span>':'')+'</button>';}
    if(G.fs){const lk=locked();h+='<button data-act="magnet" class="'+(G.magnet>=0?'on':'')+'"'+(G.charges.magnet>0&&!lk?'':' disabled')+'>'+(lk?'\u{1F512} ':'')+(G.magnet>=0&&G.wheel[G.magnet]?'Magnet on '+(G.wheel[G.magnet].void?'Void':lab(G.wheel[G.magnet].num)):'Magnet ('+G.charges.magnet+')')+'</button><button data-act="ball" class="'+(G.useBall?'on':'')+'"'+(G.charges.ball>0&&!lk?'':' disabled')+'>'+(lk?'\u{1F512} ':'')+(G.useBall?'+'+G.useBall+' ball'+(G.useBall>1?'s':''):'Extra Ball ('+G.charges.ball+')')+'</button>';}
    if(G.night<7&&G.chips+totalBets()>=toll()){const sh=leaveShort();h+='<button data-act="settle" class="payok'+(sh?' short':'')+'"><span>'+(sh&&G.leaveWarn?'Leave anyway':'Pay '+fmt(toll())+' and leave')+'</span> <span class="bon">'+(sh?'(short for night '+(G.night+1)+': '+fmt(sh.after)+' vs '+fmt(sh.next)+')':'(+'+fmt(Math.min(G.spins,5)*r5(toll()*0.1))+' bonus'+(has('bounty')&&G.spins>0?', +'+pls(cnt('bounty'),'trick'):'')+')')+'</span></button>';}
  }else if(G.mode==='nudge'){
    h+='<span class="nudgeb">'+nudgeBtns()+'</span><span class="hint">Nudge moves a ball to a nearby pocket. The numbers on the wheel show what each pocket is worth.</span>';
  }else if(G.mode==='closing'){
    h+='<button class="big" data-act="settle">'+(G.boss?'Out of spins':'Closing time: settle the tab')+'</button>';
  }else h+='<span class="hint">No more bets...</span>';
  h+='</div></div>';
  L.innerHTML=h;
}
function leaveShort(){if(!G||G.mode!=='bet'||G.night>=7||G.spins<=0)return null;const t=toll(),after=G.chips+totalBets()-t+Math.min(G.spins,5)*r5(t*0.1),next=nextTab();return after<next?{after,next}:null;}
const camForced=()=>G.mode==='spinning'||G.mode==='nudge'||G.mode==='shop'||G.armed!=null||Date.now()<(G.lookUntil||0);
function renderScene(){if(typeof SIM_SKILL==='function')return;const st=$('stage');if(!st)return;const forced=camForced(),dn=forced||!!G.look;
  st.classList.toggle('down',dn);st.classList.toggle('hot',heatOn()&&G.heat>=50);
  const lb=$('lookBtn');lb.disabled=forced;lb.textContent=dn?'\u25B2 Silas':'\u25BC Wheel';
  const n=G.night,pc=n<3?'#ffffff':n===3?'#ffb347':n<7?'#b06bff':'#5dffd0';
  $('scPup').querySelectorAll('circle').forEach(c=>c.setAttribute('fill',pc));
  $('scDark').setAttribute('opacity',(Math.max(0,n-3)*0.09).toFixed(2));
  $('scSign').textContent=PLACES[n-1].replace(/ Saloon/i,'').toUpperCase();}
function render(){
  try{renderScene();}catch(e){}
  $('place').textContent=PLACES[G.night-1];
  $('nightLbl').textContent='Night '+G.night+' of 8';
  $('say').textContent=G.msg;$('result').textContent=G.res;
  if(G.faceStage!==G.night){G.faceStage=G.night;$('face').innerHTML=dealerSVG(G.night);}
  {const sh=G.mode==='shop'&&G.night<8;$('stats').innerHTML='<div><b>'+fmt(G.chips)+'</b><small>Chips</small></div><div><b>'+fmt(sh?nextTab():toll())+'</b><small>'+(sh?(G.night===7?'House health':'Next tab'):G.boss?'House health':'Tab due')+'</small></div><div><b>'+(sh?5+cnt('watch'):G.spins)+'</b><small>'+(sh?'Spins next':'Spins left')+'</small></div><div><b>'+G.wheel.length+'</b><small>Pockets</small></div>';}
  renderActive();
  const bet=G.mode==='bet'&&!locked();
  $('eyeLine').innerHTML=(G.watch.length&&G.mode!=='shop'?'<button class="tapbox eyebtn" data-act="sheet" data-t="eye">👁 <b>'+watchNames().join(', ')+'</b> pay nothing<span class="qi">?</span></button>':'');
  $('heatBox').innerHTML=heatOn()?'<button class="tapbox" data-act="sheet" data-t="heat"><span class="heatlbl" style="display:block">Heat <b>'+G.heat+'</b> / 100'+(locked()?' · tricks locked':G.heat>=50?' · Silas is watching':'')+'<span class="qi">?</span></span><span class="heatbar" style="display:block"><i style="width:'+Math.min(100,G.heat)+'%"></i><u style="left:50%"></u><u style="left:75%"></u></span></button>':'';
  $('powers').innerHTML=G.mode==='nudge'?nudgeBtns():'<button data-act="magnet" class="'+(G.armed==='magnet'||G.magnet>=0?'on':'')+'"'+(bet&&G.charges.magnet>0?'':' disabled')+' title="Pick a pocket. It is much more likely this spin.">'+(locked()?'\u{1F512} ':'')+(G.armed==='magnet'?'Magnet: now tap a pocket':G.magnet>=0&&G.wheel[G.magnet]?'Magnet: '+(G.wheel[G.magnet].void?'Void':lab(G.wheel[G.magnet].num))+' \u2715':'Magnet ('+G.charges.magnet+')')+'</button>'+
    '<button data-act="ball" class="'+(G.useBall?'on':'')+'"'+(bet&&G.charges.ball>0?'':' disabled')+' title="Spin extra balls. Tap again to add more.">'+(locked()?'\u{1F512} ':'')+(G.useBall?'+'+G.useBall+' ball'+(G.useBall>1?'s':'')+' this spin':'Extra Ball ('+G.charges.ball+')')+'</button>'+
    '<button disabled title="After the ball lands you may move it one pocket.">'+(locked()?'\u{1F512} ':'')+'Nudge ('+G.charges.nudge+')</button>'+
    '';
  {const m=mult({gold:false});$('modBtn').textContent='Rules'+(m===1?'':' \u00B7 wins x'+m.toFixed(2))+(has('streak')?' \u00B7 streak '+G.streak:'');$('modBtn').className=m===1?'':'hotm';}
  $('fastBtn').className=G.fast?'on':'';$('fastBtn').title='Fast spins: '+(G.fast?'on':'off');
  {const fb=$('fsBtn');if(fb){fb.style.display=STANDALONE()||!matchMedia('(pointer:coarse)').matches&&!FS_OK()?'none':'';fb.textContent=isFull()?'\u2921':'\u2922';fb.title=isFull()?'Leave full screen':'Full screen';}}
  $('muteBtn').textContent=muted?'\u{1F507}':'\u{1F50A}';$('muteBtn').title='Sound: '+(muted?'off':'on');
  {const bn=$('banner');bn.className='';}
  if(G.watch.length&&G.mode!=='spinning'&&G.mode!=='shop'){const n=G.wheel.length,mid=G.watch[Math.floor(G.watch.length/2)];setTimeout(()=>lookAt(G.wAngle+(mid+0.5)*360/n),0);}
  document.body.classList.toggle('fs',!!(G.fs&&G.mode==='bet'&&!G.fsHold&&G.armed===null));
  renderWheel();renderLower();tentacles();saveGame();
}

/* ---------- input ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.bet){placeBet(b.dataset.bet);return;}
  if(b.dataset.chip){const c=b.dataset.chip;G.chip=isNaN(+c)?c:+c;render();return;}
  const a=b.dataset.act;if(!a)return;
  switch(a){
    case'begin':ac();if(FS_OK()&&matchMedia('(pointer:coarse)').matches)goFull();store.del(SAVE_KEY);playerName()?pickStart():askName('begin');break;
    case'resume':ac();if(FS_OK()&&matchMedia('(pointer:coarse)').matches)goFull();playerName()?resumeGame():askName('resume');break;
    case'name':setName(b.dataset.then);break;
    case'start':G.relics.push(b.dataset.id);G.log.startRelic=b.dataset.id;$('overlay').className='';startNight();break;
    case'sendFb':sendFeedback();break;
    case'restart':sendFeedback(true);newGame();$('overlay').className='';applyDread();render();pickStart();$('overlay').className='show';break;
    case'spin':spin();break;
    case'clear':clearBets();break;
    case'fs':{const inFs=!!(G.fs&&G.mode==='bet'&&!G.fsHold&&G.armed===null);if(inFs)G.fs=false;else{G.fs=true;G.fsHold=false;}render();}break;
    case'help':showHelp();break;
    case'sheet':showSheet(b.dataset.t,!!b.dataset.back);highlight(b.dataset.hl);break;
    case'remove':G.remove=!G.remove;tip(G.remove?'Removing: tap a bet to pull chips off it. Each tap takes back the selected chip amount.':'Back to placing bets.');render();break;
    case'rebet':rebet();break;
    case'settle':{const sh=leaveShort();if(G.mode==='bet'&&sh&&!G.leaveWarn){G.leaveWarn=true;sfx.bad();tip('Leaving now puts you in night '+(G.night+1)+' with about '+fmt(sh.after)+' chips against a '+fmt(sh.next)+' tab. You still have '+pls(G.spins,'spin')+'. Tap again to leave anyway.');render();break;}G.leaveWarn=false;endNight();break;}
    case'nudgeArm':if(G.mode==='nudge'){G.armed=G.armed==='nudge'?null:'nudge';tip(G.armed?'Tap one of the glowing pockets near the ball.':'Nudge the ball, or leave it.');render();if(G.armed)showWheel();}break;
    case'n0':nudge(0);break;
    case'actToggle':store.set('dmw_actc',store.get('dmw_actc')==='1'?'0':'1');renderActive();break;
    case'skTap':skFinish(false);break;
    case'magnet':if(G.magnet>=0){G.magnet=-1;G.armed=null;}else G.armed=G.armed==='magnet'?null:'magnet';if(G.armed)tip('Magnet: tap a pocket on the wheel.');render();break;
    case'ball':G.useBall=(G.useBall+1)%(Math.min(G.charges.ball,3)+1);render();break;
    case'relic':buyRelic(+b.dataset.i);break;
    case'tool':buyTool(+b.dataset.i);break;
    case'reroll':reroll();break;
    case'next':logRun();G.night++;startNight();break;
    case'items':showItems('mine');highlight(b.dataset.hl);break;
    case'invTab':showItems(b.dataset.tab);break;
    case'mods':showItems('mods');break;
    case'peek':peek(b.dataset.target);break;
    case'tinfo':tinfo(b);break;
    case'look':G.look=!G.look;renderScene();break;
    case'amtOk':amtOk();break;
    case'amtNo':amtNo();break;
    case'closeItems':$('overlay').className='';if(NEXT_DLG){const f=NEXT_DLG;NEXT_DLG=null;f();}break;
    case'copyRun':{const t=runText(),box=$('runBox'),show=()=>{box.style.display='block';box.value=t;box.focus();box.select();};try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied';},show);}catch(e){show();}}break;
    case'fast':G.fast=!G.fast;render();break;
    case'fullscr':toggleFull();break;
    case'mute':muted=!muted;setDrone();render();break;
  }
});
let pd=null;
$('wheel').addEventListener('pointerdown',e=>{pd=[e.clientX,e.clientY];});
$('wheel').addEventListener('pointerup',e=>{
  if(!pd||Math.hypot(e.clientX-pd[0],e.clientY-pd[1])>12){pd=null;return;}pd=null;
  const W=$('wheel'),r=W.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)*400/r.width,y=(e.clientY-r.top-r.height/2)*400/r.height;
  const rad=Math.hypot(x,y);if(rad<88||rad>198)return;
  const n=G.wheel.length;let a=Math.atan2(y,x)*180/Math.PI+90-G.wAngle;a=((a%360)+360)%360;
  pocketClick(Math.min(n-1,Math.floor(a/(360/n))));
});
document.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-bet]');if(b){e.preventDefault();unbet(b.dataset.bet);}});
document.addEventListener('mousemove',e=>{
  if(!G||G.mode==='spinning'||G.watch.length)return;const w=$('wheel').getBoundingClientRect();
  const dx=e.clientX-(w.left+w.width/2),dy=e.clientY-(w.top+w.height/2);lookAt(Math.atan2(dy,dx)*180/Math.PI+90);
});
setInterval(()=>{
  if(!G||dread()<0.4||G.mode==='spinning')return;
  const ls=document.querySelectorAll('.pl');if(!ls.length)return;
  const el=ls[Math.floor(Math.random()*ls.length)];el.textContent=GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
  setTimeout(()=>{if(el.isConnected)el.textContent=el.dataset.t;},380);
},Math.round(1100));

let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(G&&G.mode!=='intro'&&G.mode!=='over'){renderLower();tentacles();}},150);});
document.addEventListener('scroll',()=>{if(G)tentacles();},{passive:true,capture:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){saveGame();postRun(true);}});
window.addEventListener('pagehide',()=>{saveGame();postRun(true);});
newGame();applyDread();render();intro();
</script>
</body>
